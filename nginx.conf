# Runs INSIDE the "web" container: serves the static page and forwards /api/ to the "api" container.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; media-src https:; connect-src 'self' https://*.api.radio-browser.info; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'" always;

    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header X-Real-IP $http_x_real_ip;   # real visitor IP, set by the host nginx
        proxy_read_timeout 20s;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
